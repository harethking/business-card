<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="بطاقة أعمال رقمية - حارث خالد فياض، مهندس مدني">
<meta name="theme-color" content="#0b1a33">
<meta name="robots" content="index, follow">
<title>حارث خالد فياض | مهندس مدني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0b1a33;
    --navy-2: #132847;
    --gold: #d4af37;
    --gold-2: #f5d77a;
    --text: #f4efe1;
    --muted: #aab6cb;
    --line: rgba(212, 175, 55, .38);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    font-family: "Tajawal", "Segoe UI", Tahoma, Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 500px at 50% -10%, #1f3d70 0%, transparent 60%),
      linear-gradient(160deg, #07122a 0%, #0b1a33 50%, #050d1f 100%);
    direction: rtl;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 420px;
    padding: 36px 24px 26px;
    border-radius: 28px;
    text-align: center;
    background: linear-gradient(180deg, rgba(19, 40, 71, .94), rgba(11, 26, 51, .97));
    border: 1px solid var(--line);
    box-shadow:
      0 30px 60px -20px rgba(0, 0, 0, .65),
      inset 0 1px 0 rgba(245, 215, 122, .15);
    overflow: hidden;
    opacity: 0;
    transform: translateY(16px);
    animation: rise .9s cubic-bezier(.2, .7, .2, 1) forwards;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 35%, rgba(245, 215, 122, .09) 50%, transparent 65%);
    transform: translateX(-100%);
    animation: sheen 5s ease-in-out 1.2s infinite;
    pointer-events: none;
  }

  .corner {
    position: absolute;
    width: 46px;
    height: 46px;
    border-color: var(--gold);
    border-style: solid;
    opacity: .7;
  }
  .corner.tr { top: 12px; right: 12px; border-width: 1px 1px 0 0; border-radius: 0 12px 0 0; }
  .corner.bl { bottom: 12px; left: 12px; border-width: 0 0 1px 1px; border-radius: 0 0 0 12px; }

  /* Avatar / photo placeholder */
  .avatar {
    width: 124px;
    height: 124px;
    margin: 4px auto 18px;
    padding: 3px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-2), var(--gold) 50%, #9a7b1f);
    box-shadow: 0 10px 30px -10px rgba(212, 175, 55, .55);
    animation: float 6s ease-in-out infinite;
  }

  .avatar-inner {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--navy-2);
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  .initials {
    font-size: 46px;
    font-weight: 800;
    color: var(--gold-2);
  }

  .avatar-inner img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  h1 {
    font-size: clamp(26px, 7vw, 30px);
    font-weight: 800;
    color: var(--gold-2);
    line-height: 1.35;
    letter-spacing: .3px;
  }

  .job {
    margin-top: 8px;
    font-size: 19px;
    font-weight: 700;
    color: var(--text);
  }

  .job-en {
    margin-top: 2px;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 2.5px;
    text-transform: uppercase;
    direction: ltr;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 20px auto 22px;
    width: 70%;
    color: var(--gold);
  }
  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .divider span {
    width: 6px;
    height: 6px;
    transform: rotate(45deg);
    background: var(--gold);
  }

  .phone {
    display: inline-block;
    margin-bottom: 20px;
    font-size: 17px;
    font-weight: 500;
    color: var(--muted);
    text-decoration: none;
    direction: ltr;
    letter-spacing: 1px;
  }

  /* Action buttons */
  .actions {
    display: grid;
    gap: 12px;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 14px 18px;
    border-radius: 16px;
    text-decoration: none;
    color: var(--text);
    background: rgba(255, 255, 255, .03);
    border: 1px solid var(--line);
    font: inherit;
    text-align: right;
    cursor: pointer;
    transition: transform .2s ease, background .25s ease, border-color .25s ease, box-shadow .25s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:hover,
  .btn:focus-visible {
    transform: translateY(-2px);
    background: rgba(212, 175, 55, .09);
    border-color: var(--gold);
    box-shadow: 0 10px 22px -12px rgba(212, 175, 55, .6);
    outline: none;
  }

  .btn:active { transform: scale(.98); }

  .btn-icon {
    flex: 0 0 44px;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background: rgba(212, 175, 55, .12);
    color: var(--gold-2);
  }

  .btn-icon svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .btn-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    flex: 1;
  }

  .btn-title {
    font-size: 17px;
    font-weight: 700;
  }

  .btn-sub {
    font-size: 13px;
    color: var(--muted);
    direction: ltr;
    text-align: right;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--gold-2), var(--gold) 55%, #b8922a);
    border-color: transparent;
    color: #1a1406;
  }
  .btn-primary .btn-icon {
    background: rgba(11, 26, 51, .14);
    color: #1a1406;
  }
  .btn-primary .btn-sub { color: rgba(26, 20, 6, .7); }
  .btn-primary:hover,
  .btn-primary:focus-visible {
    background: linear-gradient(135deg, #ffe690, var(--gold));
    border-color: transparent;
    color: #1a1406;
  }

  .toast {
    min-height: 22px;
    margin-top: 14px;
    font-size: 14px;
    color: var(--gold-2);
    opacity: 0;
    transition: opacity .3s ease;
  }
  .toast.show { opacity: 1; }

  footer {
    margin-top: 18px;
    font-size: 12px;
    color: var(--muted);
    opacity: .75;
    letter-spacing: .5px;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @keyframes sheen {
    0%, 60% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  @media (max-width: 360px) {
    .card { padding: 30px 18px 22px; }
    .btn { padding: 12px 14px; gap: 10px; }
    .btn-icon { flex-basis: 40px; width: 40px; height: 40px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
    .card { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<main class="card" id="card">
  <span class="corner tr" aria-hidden="true"></span>
  <span class="corner bl" aria-hidden="true"></span>

  <div class="avatar" aria-hidden="false">
    <div class="avatar-inner">
      <span class="initials" aria-hidden="true">ح</span>
      <img src="photo.jpg" alt="حارث خالد فياض" onerror="this.remove()">
    </div>
  </div>

  <h1>حارث خالد فياض</h1>
  <p class="job">مهندس مدني</p>
  <p class="job-en">Civil Engineer</p>

  <div class="divider" aria-hidden="true"><span></span></div>

  <a class="phone" href="tel:+9647801691548" aria-label="رقم الهاتف">07801691548</a>

  <nav class="actions" aria-label="خيارات التواصل">
    <a class="btn btn-primary" href="tel:+9647801691548">
      <span class="btn-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </span>
      <span class="btn-text">
        <span class="btn-title">اتصال</span>
        <span class="btn-sub">+964 780 169 1548</span>
      </span>
    </a>

    <a class="btn" href="https://wa.me/9647801691548" target="_blank" rel="noopener noreferrer">
      <span class="btn-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      </span>
      <span class="btn-text">
        <span class="btn-title">واتساب</span>
        <span class="btn-sub">مراسلة مباشرة</span>
      </span>
    </a>

    <a class="btn" href="https://www.instagram.com/h_are6/" target="_blank" rel="noopener noreferrer">
      <span class="btn-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.6" cy="6.4" r=".6" fill="currentColor"/></svg>
      </span>
      <span class="btn-text">
        <span class="btn-title">إنستغرام</span>
        <span class="btn-sub">@h_are6</span>
      </span>
    </a>

    <button class="btn" type="button" id="saveContact">
      <span class="btn-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
      </span>
      <span class="btn-text">
        <span class="btn-title">حفظ جهة الاتصال</span>
        <span class="btn-sub">ملف VCF</span>
      </span>
    </button>
  </nav>

  <p class="toast" id="toast" role="status" aria-live="polite"></p>

  <footer>بطاقة أعمال رقمية</footer>
</main>

<script>
(function () {
  "use strict";

  var CONTACT_PHONE = "+9647801691548";
  var FILE_NAME = "hareth-khaled-fayyadh.vcf";

  function buildVCard() {
    var lines = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:فياض;حارث خالد;;;",
      "FN:حارث خالد فياض",
      "TITLE:مهندس مدني",
      "NOTE:Civil Engineer",
      "TEL;TYPE=CELL,VOICE:" + CONTACT_PHONE,
      "URL:https://www.instagram.com/h_are6/",
      "END:VCARD"
    ];
    return lines.join("\r\n") + "\r\n";
  }

  function showToast(message) {
    var toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(function () {
      toast.classList.remove("show");
    }, 2800);
  }

  function saveContact() {
    try {
      var blob = new Blob([buildVCard()], { type: "text/vcard;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.href = url;
      link.download = FILE_NAME;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      showToast("تم تجهيز ملف جهة الاتصال");
    } catch (err) {
      showToast("تعذّر تنزيل الملف، حاول مرة أخرى");
    }
  }

  var saveButton = document.getElementById("saveContact");
  if (saveButton) {
    saveButton.addEventListener("click", saveContact);
  }
})();
</script>

</body>
</html>
